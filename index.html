<!DOCTYPE html>
<html lang="de" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PaulFV – Apps</title>
  <meta name="description" content="Die Web-Apps von PaulFV: G04Event und G04EggX.">
  <meta name="theme-color" content="#0E1115">
  <link rel="icon" type="image/png" href="/G04Event/favicon-32.png">
  <style>
    :root{--bg:#0E1115;--card:#161B22;--line:#2A313C;--ink:#F2F4F7;--muted:#A8B0BC;--accent:#7AC5FF}
    @media (prefers-color-scheme:light){:root{--bg:#F4F6F9;--card:#FFFFFF;--line:#DCE1E8;--ink:#12161C;--muted:#5B6574;--accent:#1F6FC0}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
      font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      display:flex;flex-direction:column;align-items:center;padding:56px 16px 32px}
    main{width:100%;max-width:560px}
    h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
    .sub{color:var(--muted);margin:0 0 32px}
    .apps{display:grid;gap:14px}
    a.app{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:18px;
      background:var(--card);color:inherit;text-decoration:none;transition:border-color .15s ease,transform .15s ease}
    a.app:hover,a.app:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
    .app img{width:64px;height:64px;border-radius:15px;flex:none;background:#000}
    .app strong{display:block;font-size:18px}
    .app span{display:block;color:var(--muted);font-size:14.5px}
    .app .pfeil{margin-left:auto;font-size:26px;color:var(--muted)}
    footer{margin-top:auto;padding-top:40px;color:var(--muted);font-size:13px}
    footer a{color:var(--muted)}
    @media (prefers-reduced-motion:reduce){a.app{transition:none}}
  </style>
</head>
<body>
  <main>
    <h1>PaulFV</h1>
    <p class="sub">Kleine Web-Apps fürs Handy, auch als Android-App im Play Store.</p>
    <div class="apps">
      <a class="app" href="/G04Event/">
        <img src="/G04Event/icon-192.png" alt="" width="64" height="64">
        <div><strong>G04Event</strong><span>Feste &amp; Festivals in Europas Städten, mit Countdown.</span></div>
        <b class="pfeil" aria-hidden="true">›</b>
      </a>
      <a class="app" href="/G04EggX/">
        <img src="/G04EggX/icon-192.png" alt="" width="64" height="64">
        <div><strong>G04EggX</strong><span>Der futuristische Eier-Timer.</span></div>
        <b class="pfeil" aria-hidden="true">›</b>
      </a>
    </div>
  </main>
  <footer><a href="https://github.com/PaulFV">github.com/PaulFV</a></footer>
</body>
</html>
